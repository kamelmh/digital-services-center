<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The Violit web app calls three generator category groups directly. The one-click orchestrator only reaches three of roughly fifteen client-facing generators. The purpose-built NESDA dossier generator exists but has zero references anywhere in the codebase.</desc>
