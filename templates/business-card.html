<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Visite - Digital Services Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .card-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .card {
            width: 3.5in;
            height: 2in;
            background: #0A1628;
            border-radius: 8px;
            padding: 20px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .card.front {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .card.back {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #0A1628;
        }
        
        .name {
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .title {
            font-size: 10px;
            color: #D4AF37;
            margin-top: 2px;
        }
        
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #D4AF37 0%, transparent 100%);
            margin: 10px 0;
        }
        
        .contact {
            font-size: 9px;
            line-height: 1.6;
        }
        
        .contact span {
            color: #D4AF37;
        }
        
        .back .logo {
            width: 60px;
            height: 60px;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .back .business-name {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .back .tagline {
            font-size: 9px;
            color: #D4AF37;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .back .services {
            margin-top: 15px;
            font-size: 8px;
            line-height: 1.8;
            color: #ccc;
        }
        
        .back .website {
            margin-top: 15px;
            font-size: 9px;
            color: #D4AF37;
        }
        
        .gold-accent {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, transparent 50%, #D4AF37 50%);
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <!-- Front of Card -->
        <div class="card front">
            <div class="gold-accent"></div>
            <div>
                <div class="logo">MK</div>
                <div class="name">MAHI Kamel Abdelghani</div>
                <div class="title">Founder & Digital Services</div>
            </div>
            <div>
                <div class="divider"></div>
                <div class="contact">
                    <span>📞</span> +213 676 77 38 92<br>
                    <span>✉️</span> kamelmahi71@gmail.com<br>
                    <span>📍</span> El Bayadh, Algeria
                </div>
            </div>
        </div>
        
        <!-- Back of Card -->
        <div class="card back">
            <div class="gold-accent"></div>
            <div class="logo">MK</div>
            <div class="business-name">DIGITAL SERVICES CENTER</div>
            <div class="tagline">Services Professionnels</div>
            <div class="services">
                CV Design &bull; Documents &bull; Traduction<br>
                Marketing Digital &bull; Web &bull; Excel
            </div>
            <div class="website">www.kamelmahi.netlify.app</div>
        </div>
    </div>
</body>
</html>
