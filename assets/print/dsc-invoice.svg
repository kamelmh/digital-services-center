<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <!-- Header -->
  <g transform="translate(40, 30) scale(0.12)">
    <path d="M 80 80 L 80 320 L 140 180 L 200 320 L 200 80"
          fill="none" stroke="#0A1628" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 200 80 L 200 320" fill="none" stroke="#0A1628" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200 200 L 320 80" fill="none" stroke="#0A1628" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200 200 L 320 320" fill="none" stroke="#0A1628" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="200" r="1" fill="#0A1628"/>
  </g>
  <text x="95" y="60" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#0A1628">Digital Services Center</text>
  <text x="95" y="78" font-family="Inter, sans-serif" font-size="8" font-weight="400" fill="#666" letter-spacing="2">FEASIBILITY &bull; AUTOMATION &bull; TRAINING</text>
  <!-- Header line -->
  <rect x="40" y="95" width="714" height="2" fill="#D4AF37"/>
  <!-- Invoice title -->
  <text x="600" y="140" font-family="Space Grotesk, sans-serif" font-size="32" font-weight="700" fill="#0A1628">INVOICE</text>
  <!-- Invoice details -->
  <text x="500" y="175" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A">Invoice #: ___________</text>
  <text x="500" y="195" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A">Date: ___________</text>
  <text x="500" y="215" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A">Due: ___________</text>
  <!-- Client info -->
  <text x="40" y="175" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628">Bill To:</text>
  <text x="40" y="195" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A">Client Name: ___________</text>
  <text x="40" y="215" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A">Address: ___________</text>
  <!-- Table header -->
  <rect x="40" y="260" width="714" height="30" fill="#0A1628"/>
  <text x="50" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">DESCRIPTION</text>
  <text x="500" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">QTY</text>
  <text x="580" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">PRICE</text>
  <text x="680" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">TOTAL</text>
  <!-- Table rows -->
  <rect x="40" y="290" width="714" height="30" fill="#F5F5F0"/>
  <rect x="40" y="320" width="714" height="30" fill="#FFFFFF"/>
  <rect x="40" y="350" width="714" height="30" fill="#F5F5F0"/>
  <rect x="40" y="380" width="714" height="30" fill="#FFFFFF"/>
  <rect x="40" y="410" width="714" height="30" fill="#F5F5F0"/>
  <!-- Total -->
  <rect x="500" y="460" width="254" height="30" fill="#0A1628"/>
  <text x="510" y="480" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">TOTAL: ___________ DZD</text>
  <!-- Payment info -->
  <text x="40" y="530" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628">Payment Terms:</text>
  <text x="40" y="550" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A">Payment due within 30 days of invoice date.</text>
  <!-- Footer -->
  <rect x="40" y="1060" width="714" height="1" fill="#D4AF37"/>
  <text x="397" y="1085" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="400" fill="#999" letter-spacing="2">DIGITAL SERVICES CENTER &bull; El Bayadh, Algeria &bull; kamelmahi71@gmail.com &bull; +213 676 77 38 92</text>
</svg>