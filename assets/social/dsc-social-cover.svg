<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <rect width="100%" height="100%" fill="#0A1628"/>
  <!-- Subtle pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#D4AF37" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <!-- MK icon left -->
  <g transform="translate(80, 20) scale(0.5)">
    <path d="M 80 80 L 80 320 L 140 180 L 200 320 L 200 80"
          fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 200 80 L 200 320"
          fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
    <path d="M 200 200 L 320 80"
          fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
    <path d="M 200 200 L 320 320"
          fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
    <circle cx="200" cy="200" r="7" fill="#D4AF37"/>
  </g>
  <!-- Company name -->
  <text x="320" y="180" font-family="Space Grotesk, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="3">DIGITAL SERVICES CENTER</text>
  <!-- Tagline -->
  <text x="320" y="230" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#D4AF37" letter-spacing="6">FEASIBILITY &bull; AUTOMATION &bull; TRAINING</text>
  <!-- Contact -->
  <text x="320" y="280" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#666" letter-spacing="2">kamelmahi71@gmail.com | +213 676 77 38 92</text>
  <!-- Gold accent line -->
  <rect x="320" y="250" width="200" height="2" fill="#D4AF37"/>
</svg>