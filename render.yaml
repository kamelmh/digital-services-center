services:
  - type: web
    name: dsc-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && pip install sqlalchemy alembic redis rq boto3 gunicorn
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT apps.api.app.main:app
    envVars:
      # Set manually in dashboard: Neon connection string (postgresql://…neon.tech/neondb?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: dsc-redis
          type: redis
          property: connectionString
      - key: DSC_JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DSC_AUTH_REQUIRED
        value: "true"
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
    healthCheckPath: /health

  - type: worker
    name: dsc-worker
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && pip install sqlalchemy alembic redis rq boto3
    startCommand: python -m rq worker --url $REDIS_URL dsc-queue
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: dsc-redis
          type: redis
          property: connectionString

  - type: redis
    name: dsc-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
