services:
  # Free plan: no background workers available — jobs run INLINE inside the API
  # (dossiers router falls back to synchronous generation when Redis is absent).
  # To scale later: re-add type=worker + type=redis services and upgrade the plan.
  - type: web
    name: dsc-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && pip install sqlalchemy alembic redis rq boto3 gunicorn
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT apps.api.app.main:app
    envVars:
      # Production: use Neon least-privilege role dsc_app (not owner). See 003_rls_policies.sql §0
      # and PRODUCTION_CHECKLIST.md — create role once on Neon, then paste DSN below.
      - key: DATABASE_URL
        sync: false  # postgresql://dsc_app:<password>@<neon-host>/neondb?sslmode=require
      # No Redis on free plan -> enqueue raises -> inline fallback generates directly
      - key: REDIS_URL
        value: "disabled"
      - key: DSC_JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DSC_AUTH_REQUIRED
        value: "true"
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      # Billing — Chargily Pay v2 (BaridiMob/CIB/Dahabiya, DZD-only). See PRODUCTION_CHECKLIST.md.
      # Live cutover: set the 3 secrets below in the Render dashboard, then flip DSC_BILLING_GATEWAY mock→chargily.
      # The API auto-routes test_… keys to pay.chargily.dz/test/api/v2/checkouts (billing.py:96-97).
      - key: DSC_BILLING_GATEWAY
        value: mock  # Switch to 'chargily' when keys are set (Sprint 7)
      - key: DSC_CHARGILY_KEY
        sync: false  # live_… (prod) or test_… (sandbox) from https://pay.chargily.dz
      - key: DSC_CHARGILY_SECRET
        sync: false  # API secret, pairs with DSC_CHARGILY_KEY
      - key: DSC_BILLING_WEBHOOK_SECRET
        sync: false  # Must match Chargily dashboard → Webhooks → Signing secret
      - key: DSC_FRONTEND_URL
        value: "https://dsc-web-*.onrender.com"  # Update with actual dsc-web URL
      - key: DSC_WEBHOOK_URL
        value: "https://dsc-api-vsex.onrender.com/billing/webhook"  # Public, Chargily posts here; must be HTTPS
    healthCheckPath: /health

  # Frontend — Next.js admin dashboard
  - type: web
    name: dsc-web
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd apps/web && npm install && npm run build
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://dsc-api-vsex.onrender.com"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /
