services:
  # Free plan: no background workers available — jobs run INLINE inside the API
  # (dossiers router falls back to synchronous generation when Redis is absent).
  # To scale later: re-add type=worker + type=redis services and upgrade the plan.
  - type: web
    name: dsc-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && pip install sqlalchemy alembic redis rq boto3 gunicorn
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT apps.api.app.main:app
    envVars:
      # Set manually in dashboard: Neon connection string (postgresql://…neon.tech/neondb?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # No Redis on free plan -> enqueue raises -> inline fallback generates directly
      - key: REDIS_URL
        value: "disabled"
      - key: DSC_JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DSC_AUTH_REQUIRED
        value: "true"
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
    healthCheckPath: /health

  # Frontend — Next.js admin dashboard
  - type: web
    name: dsc-web
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd apps/web && npm install && npm run build
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://dsc-api-vsex.onrender.com"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /
