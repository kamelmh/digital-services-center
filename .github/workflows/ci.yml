name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: pip install -r requirements.txt && pip install sqlalchemy alembic redis rq boto3
      - name: Unit tests (55)
        run: python -m pytest tests/test_generators.py tests/test_cross_artifact_integration.py -q --override-ini="addopts="
      - name: Rate checks (38)
        run: python verify_rates.py
      - name: Compile check
        run: python -m compileall -q apps
