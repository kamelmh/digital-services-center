name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # App uses dsc_app (non-superuser) so FORCE RLS is load-bearing; migration creates role.
      DATABASE_URL: postgresql://dsc_app:dsc_app_local@localhost:5432/neondb
      DSC_RLS_TEST_DATABASE_URL: postgresql://dsc_app:dsc_app_local@localhost:5432/neondb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install sqlalchemy alembic redis rq boto3 pytest httpx
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: |
          alembic upgrade head
          psql "$DATABASE_URL" -f apps/api/migrations/003_rls_policies.sql
      - name: Verify RLS is active (incl. FORCE)
        run: |
          psql "$DATABASE_URL" -c "SELECT relname, relrowsecurity, relforcerowsecurity FROM pg_class WHERE relname IN ('users','dossiers','jobs','checkouts');"
          psql "$DATABASE_URL" -c "SELECT current_user;"
      - name: Unit tests (132)
        run: python -m pytest tests/test_generators.py tests/test_cross_artifact_integration.py -q --override-ini="addopts="
      - name: Rate checks (38)
        run: python verify_rates.py
      - name: Compile check
        run: python -m compileall -q apps
      - name: SaaS integration tests (15)
        run: python -m pytest tests/test_saas_auth_billing_integration.py -q --override-ini="addopts="
      - name: Tenant isolation + RLS tests (17)
        run: python -m pytest tests/test_tenant_isolation.py -q --override-ini="addopts="
      - name: RLS enforcement — real PG probe as dsc_app
        run: python -m pytest tests/test_rls_enforcement.py -q --override-ini="addopts="